apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: prefect-gateway
  namespace: prefect
  annotations:
    # References the Certificate Manager cert map created in terraform/iap.tf
    networking.gke.io/certmap: prefect-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
    allowedRoutes:
      namespaces:
        from: Same
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
  addresses:
  - type: NamedAddress
    # Matches the google_compute_global_address name in terraform/iap.tf
    value: prefect-gateway-ip
