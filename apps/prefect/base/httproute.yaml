apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prefect-route
  namespace: prefect
spec:
  parentRefs:
  - name: prefect-gateway
    sectionName: https
  rules:
  - backendRefs:
    - name: prefect-server
      port: 4200
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prefect-http-redirect
  namespace: prefect
spec:
  parentRefs:
  - name: prefect-gateway
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
